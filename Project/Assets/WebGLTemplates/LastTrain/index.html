<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LAST TRAIN</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080b13}
    canvas{display:block;width:100%;height:100%;outline:none;image-rendering:pixelated;background:#000}
    #loading{position:fixed;left:35%;top:50%;width:30%;height:4px;background:#292034;pointer-events:none}
    #progress{height:100%;width:0;background:#ff5cce}
    #error{display:none;position:fixed;inset:30% 12%;color:#fff;font:16px monospace;white-space:pre-wrap}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="LAST TRAIN"></canvas>
  <div id="loading"><div id="progress"></div></div>
  <div id="error" role="alert"></div>
  <script>
    const canvas=document.getElementById('game');
    const loading=document.getElementById('loading');
    const error=document.getElementById('error');
    canvas.addEventListener('pointerdown',()=>canvas.focus());
    canvas.addEventListener('keydown',event=>{
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code))event.preventDefault();
    });
    const config={
      dataUrl:'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',
      companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
      productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio:1
    };
    const script=document.createElement('script');
    script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onload=()=>createUnityInstance(canvas,config,value=>{
      document.getElementById('progress').style.width=(value*100)+'%';
    }).then(()=>{loading.remove();canvas.focus();}).catch(message=>{
      loading.remove();error.textContent='Unable to start LAST TRAIN.\n'+message;error.style.display='block';
    });
    script.onerror=()=>{loading.remove();error.textContent='Unable to load LAST TRAIN.';error.style.display='block';};
    document.body.appendChild(script);
  </script>
</body>
</html>
